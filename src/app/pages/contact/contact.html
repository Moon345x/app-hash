<section class="contact-page">
  <div class="contact-card">
    <div class="contact-copy">
      <p class="eyebrow">Contacto</p>
      <h1>Hablemos.</h1>
      <p>
        Si necesitas más información, quieres colaborar o simplemente comentar algo,
        estaremos encantados de responderte.
      </p>

      <ul class="contact-list">
        <li><strong>Email:</strong> hola@hashapp.dev</li>
        <li><strong>Teléfono:</strong> +34 600 123 456</li>
        <li><strong>Ciudad:</strong> Madrid, España</li>
      </ul>
    </div>

    <form class="contact-form">
      <label>
        Nombre
        <input type="text" placeholder="Tu nombre" />
      </label>
      <label>
        Email
        <input type="email" placeholder="tu@email.com" />
      </label>
      <label>
        Mensaje
        <textarea rows="4" placeholder="Escribe tu mensaje..."></textarea>
      </label>
      <button type="button">Enviar</button>
    </form>
  </div>

  <a routerLink="/" class="back-link">Volver al inicio</a>
</section>
